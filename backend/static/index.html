<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWSCheppu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    background: #eaf6ff;
    color: #1b2a3a;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(60% 40% at 20% 0%, rgba(56,176,255,0.18), transparent 60%),
      radial-gradient(50% 35% at 85% 100%, rgba(135,206,250,0.20), transparent 60%),
      #eaf6ff;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid rgba(30,120,190,0.12);
    z-index: 10;
  }
  .header-logo {
    width: 30px; height: 30px;
    background: linear-gradient(135deg, #7ec8ff, #3b9bf0);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    box-shadow: 0 2px 10px rgba(59,155,240,0.35);
  }
  .header-title {
    font-size: 14px;
    font-weight: 600;
    color: #10233a;
    letter-spacing: -0.01em;
  }
  .header-subtitle {
    font-size: 11px;
    color: rgba(27,42,58,0.45);
    margin-left: auto;
    font-weight: 500;
  }
  .btn-clear {
    background: rgba(59,155,240,0.10);
    border: none;
    color: rgba(27,42,58,0.65);
    font-size: 11px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 100px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }
  .btn-clear:hover { background: rgba(59,155,240,0.18); color: #10233a; }
  .btn-clear:active { transform: scale(0.94); }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #30d158;
    box-shadow: 0 0 6px rgba(48,209,88,0.7);
    animation: pulse 2.4s cubic-bezier(0.4,0,0.6,1) infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* Messages */
  .messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 24px 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: rgba(59,155,240,0.25) transparent;
  }
  .messages::-webkit-scrollbar { width: 5px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(59,155,240,0.25); border-radius: 3px; }

  .message-row {
    display: flex;
    flex-direction: column;
    min-width: 0;
    width: 100%;
    max-width: 680px;
    align-self: center;
    animation: rise 0.45s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .message-row.user  { align-items: flex-end; }
  .message-row.ai    { align-items: flex-start; }
  .message-row.system{ align-items: center; }

  .message-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(27,42,58,0.42);
    margin: 0 4px 4px;
  }
  .message-row.system .message-label { display: none; }

  .message-bubble {
    padding: 11px 16px;
    border-radius: 20px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
    min-width: 0;
    max-width: 78%;
  }
  .message-row.user .message-bubble {
    background: linear-gradient(180deg, #4fb3ff, #2b8fe8);
    color: #fff;
    border-bottom-right-radius: 6px;
  }
  .message-row.ai .message-bubble {
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(59,155,240,0.15);
    color: #1b2a3a;
    border-bottom-left-radius: 6px;
  }
  .message-row.system .message-bubble {
    background: rgba(59,155,240,0.08);
    border: 1px solid rgba(59,155,240,0.12);
    color: rgba(27,42,58,0.6);
    font-size: 12.5px;
    text-align: center;
    max-width: 92%;
    border-radius: 14px;
  }

  .tool-status {
    font-size: 12.5px;
    color: #b8860b;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  /* Typing indicator */
  .typing-row { align-self: flex-start; max-width: 680px; width: 100%; }
  .typing-bubble {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 13px 16px;
    border-radius: 20px;
    border-bottom-left-radius: 6px;
    background: rgba(255,255,255,0.75);
    border: 1px solid rgba(59,155,240,0.15);
  }
  .typing-bubble span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(59,155,240,0.55);
    animation: typingBounce 1.1s ease-in-out infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Input area */
  .input-area {
    padding: 12px 20px 20px;
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-top: 1px solid rgba(30,120,190,0.12);
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .input-inner { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 10px; }

  .composer {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(59,155,240,0.25);
    border-radius: 22px;
    padding: 6px 6px 6px 16px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .composer:focus-within {
    border-color: rgba(43,143,232,0.7);
    background: #fff;
  }
  textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: #1b2a3a;
    font-family: inherit;
    font-size: 14.5px;
    padding: 8px 0;
    resize: none;
    min-height: 20px;
    max-height: 100px;
    outline: none;
    line-height: 1.5;
  }
  textarea::placeholder { color: rgba(27,42,58,0.38); }

  .btn-icon {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: rgba(59,155,240,0.12);
    color: #1b2a3a;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    transition: background 0.2s ease, transform 0.15s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s ease;
    flex-shrink: 0;
  }
  .btn-icon:hover { background: rgba(59,155,240,0.20); }
  .btn-icon:active { transform: scale(0.9); }
  .btn-icon.recording { background: #ff453a; box-shadow: 0 0 0 0 rgba(255,69,58,0.5); animation: recordPulse 1.3s infinite; }
  @keyframes recordPulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,69,58,0.45); }
    70%  { box-shadow: 0 0 0 8px rgba(255,69,58,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,69,58,0); }
  }
  .btn-send {
    background: #2b8fe8;
    color: #fff;
  }
  .btn-send:hover { background: #4fa8f5; }
  .btn-send:disabled {
    background: rgba(59,155,240,0.12);
    color: rgba(27,42,58,0.3);
    cursor: default;
    transform: none;
  }

  .shortcuts {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .shortcut {
    padding: 6px 13px;
    background: rgba(59,155,240,0.10);
    border: 1px solid rgba(59,155,240,0.18);
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(27,42,58,0.65);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }
  .shortcut:hover { background: rgba(43,143,232,0.20); color: #14568f; transform: translateY(-1px); }
  .shortcut:active { transform: scale(0.96); }

  /* Voice indicator bar */
  .voice-bar {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 500;
    color: #ff6961;
    padding: 2px 0;
  }
  .voice-bar.active { display: flex; }
  .voice-wave { display: flex; align-items: center; gap: 2px; }
  .voice-wave span {
    display: block;
    width: 2.5px;
    border-radius: 2px;
    background: #ff6961;
    animation: wave 0.9s ease-in-out infinite alternate;
  }
  .voice-wave span:nth-child(1) { height: 7px; animation-delay: 0s; }
  .voice-wave span:nth-child(2) { height: 13px; animation-delay: 0.1s; }
  .voice-wave span:nth-child(3) { height: 9px; animation-delay: 0.2s; }
  .voice-wave span:nth-child(4) { height: 15px; animation-delay: 0.3s; }
  .voice-wave span:nth-child(5) { height: 7px; animation-delay: 0.4s; }
  @keyframes wave {
    from { transform: scaleY(0.4); }
    to   { transform: scaleY(1); }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">⚡</div>
  <div class="header-title">AWSCheppu</div>
  <div class="header-subtitle">AWS Voice Control</div>
  <button class="btn-clear" onclick="clearChat()">Clear</button>
  <div class="status-dot"></div>
</div>

<div class="messages" id="messages">
  <div class="message-row system">
    <div class="message-bubble">AWSCheppu ready. Speak or type to query and manage your AWS environment.

Try: "Show idle EC2 instances", "Create a VPC called test-net", or "Run a security audit"</div>
  </div>
</div>

<div class="input-area">
  <div class="input-inner">
    <div class="shortcuts">
      <span class="shortcut" onclick="quickSend('Show idle EC2 instances')">EC2 status</span>
      <span class="shortcut" onclick="quickSend('Show security groups')">Security groups</span>
      <span class="shortcut" onclick="quickSend('List VPCs')">List VPCs</span>
      <span class="shortcut" onclick="quickSend('Run a security audit')">Security audit</span>
      <span class="shortcut" onclick="quickSend('Show cost report')">Cost report</span>
    </div>
    <div class="voice-bar" id="voiceBar">
      <div class="voice-wave">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      Listening...
    </div>
    <div class="composer">
      <button class="btn-icon" id="micBtn" title="Voice input (click to record)" onclick="toggleVoice()">🎤</button>
      <textarea
        id="inputBox"
        placeholder="Ask about your AWS infrastructure..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this); updateSendState();"
      ></textarea>
      <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;margin-left:2px;">
        <input
          id="phoneField"
          type="text"
          placeholder="+91 Phone"
          style="width:85px;padding:5px 7px;border:1px solid #c0d8e8;border-radius:6px;font-size:11px;background:#f5faff;color:#1b2a3a;outline:none;"
          title="Phone for Bolna call alerts"
        >
        <button class="btn-icon" id="phoneSave" style="font-size:11px;width:auto;padding:5px 8px;background:#e8f0fa;border-radius:6px;" title="Save phone number">📞</button>
      </div>
      <button class="btn-icon btn-send" id="sendBtn" title="Send" onclick="sendMessage()" disabled>↑</button>
    </div>
  </div>
</div>

<script>
  let isRecording = false;
  let mediaRecorder = null;
  let audioChunks = [];
  let isStreaming = false;
  let currentAudio = null;
  let currentAbortController = null;

  // Barge-in: cut off whatever VoiceOps is currently saying/streaming so a new
  // voice input can be handled immediately instead of waiting for it to finish.
  function stopCurrentResponse() {
    if (currentAbortController) {
      currentAbortController.abort();
      currentAbortController = null;
    }
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }
    setLoading(false);
    isStreaming = false;
    updateSendState();
  }

  function scrollToBottom() {
    const msgs = document.getElementById('messages');
    msgs.scrollTo({ top: msgs.scrollHeight, behavior: 'smooth' });
  }

  function addMessage(type, label, text) {
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = `message-row ${type}`;
    row.innerHTML = `
      <div class="message-label">${label}</div>
      <div class="message-bubble"></div>
    `;
    row.querySelector('.message-bubble').textContent = text;
    msgs.appendChild(row);
    scrollToBottom();
    return row;
  }

  function setLoading(loading) {
    const existing = document.getElementById('loadingIndicator');
    if (loading && !existing) {
      const msgs = document.getElementById('messages');
      const row = document.createElement('div');
      row.id = 'loadingIndicator';
      row.className = 'typing-row';
      row.innerHTML = `
        <div class="typing-bubble"><span></span><span></span><span></span></div>
      `;
      msgs.appendChild(row);
      scrollToBottom();
    } else if (!loading && existing) {
      existing.remove();
    }
  }

  function playAudio(url) {
    currentAudio = new Audio(url);
    currentAudio.play().catch(() => {});
  }

  function updateSendState() {
    const text = document.getElementById('inputBox').value.trim();
    document.getElementById('sendBtn').disabled = !text || isStreaming;
  }

  async function sendMessage() {
    const input = document.getElementById('inputBox');
    const text = input.value.trim();
    if (!text || isStreaming) return;
    input.value = '';
    autoResize(input);
    updateSendState();

    addMessage('user', 'You', text);
    setLoading(true);
    isStreaming = true;

    let aiRow = null;
    let aiText = '';

    const controller = new AbortController();
    currentAbortController = controller;

    try {
      const res = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
        signal: controller.signal,
      });
      if (!res.ok || !res.body) throw new Error(`Backend returned ${res.status}`);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let sepIdx;
        while ((sepIdx = buffer.indexOf('\n\n')) !== -1) {
          const rawEvent = buffer.slice(0, sepIdx);
          buffer = buffer.slice(sepIdx + 2);
          const line = rawEvent.split('\n').find(l => l.startsWith('data:'));
          if (!line) continue;
          const payload = line.slice(5).trim();
          if (!payload) continue;

          let evt;
          try { evt = JSON.parse(payload); } catch { continue; }

          if (evt.type === 'tool') {
            setLoading(false);
            if (!aiRow) aiRow = addMessage('ai', 'VoiceOps', '');
            const bubble = aiRow.querySelector('.message-bubble');
            bubble.innerHTML = `<span class="tool-status">🔧 ${evt.name}...</span>`;
          } else if (evt.type === 'token') {
            setLoading(false);
            if (!aiRow) aiRow = addMessage('ai', 'VoiceOps', '');
            aiText += evt.text;
            aiRow.querySelector('.message-bubble').textContent = aiText;
          } else if (evt.type === 'audio') {
            playAudio(evt.url);
          } else if (evt.type === 'error') {
            setLoading(false);
            addMessage('system', 'System', `⚠️ ${evt.text}`);
          }
          scrollToBottom();
        }
      }
    } catch (err) {
      setLoading(false);
      if (err.name !== 'AbortError') {
        addMessage('system', 'System', `⚠️ Error connecting to backend: ${err.message}`);
      }
    } finally {
      setLoading(false);
      isStreaming = false;
      updateSendState();
      if (currentAbortController === controller) currentAbortController = null;
    }
  }

  function quickSend(text) {
    const input = document.getElementById('inputBox');
    input.value = text;
    updateSendState();
    sendMessage();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  async function clearChat() {
    try { await fetch('/reset', { method: 'POST' }); } catch {}
    const msgs = document.getElementById('messages');
    msgs.innerHTML = '';
    addMessage('system', 'System', 'Conversation cleared. Speak or type to query and manage your AWS environment.');
  }

  async function toggleVoice() {
    if (isRecording) {
      stopRecording();
    } else {
      stopCurrentResponse(); // barge-in: cut off whatever VoiceOps is saying/streaming right now
      await startRecording();
    }
  }

  let audioCtx = null;
  let analyser = null;
  let meterRAF = null;
  let sawSignal = false;

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = sendAudioToBackend;
      mediaRecorder.start();
      isRecording = true;
      document.getElementById('micBtn').classList.add('recording');
      document.getElementById('voiceBar').classList.add('active');
      startLevelMeter(stream);
    } catch (err) {
      addMessage('system', 'System', '⚠️ Microphone access denied. Please allow microphone permissions.');
    }
  }

  function startLevelMeter(stream) {
    sawSignal = false;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    const bars = document.querySelectorAll('#voiceBar .voice-wave span');

    function tick() {
      analyser.getByteTimeDomainData(data);
      let sumSquares = 0;
      for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sumSquares += v * v;
      }
      const rms = Math.sqrt(sumSquares / data.length); // ~0 (silence) to ~1 (loud)
      if (rms > 0.02) sawSignal = true;
      const level = Math.min(1, rms * 6);
      bars.forEach((bar, i) => {
        bar.style.height = `${6 + level * 20 * (0.7 + 0.3 * Math.sin(i * 1.3))}px`;
        bar.style.animation = 'none';
      });
      meterRAF = requestAnimationFrame(tick);
    }
    tick();
  }

  function stopLevelMeter() {
    if (meterRAF) cancelAnimationFrame(meterRAF);
    meterRAF = null;
    if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
    analyser = null;
    document.querySelectorAll('#voiceBar .voice-wave span').forEach(bar => {
      bar.style.height = '';
      bar.style.animation = '';
    });
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
      isRecording = false;
      document.getElementById('micBtn').classList.remove('recording');
      document.getElementById('voiceBar').classList.remove('active');
      stopLevelMeter();
      if (!sawSignal) {
        addMessage('system', 'System', "⚠️ No microphone signal was detected during that recording at all — this points to a Windows/browser mic permission or input-device issue, not the app. Check Windows Settings → Privacy & security → Microphone, and Settings → System → Sound → Input to confirm the right device is selected.");
      }
    }
  }

  async function sendAudioToBackend() {
    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    if (!sawSignal) return; // stopRecording() already reported the no-signal warning for this attempt
    if (blob.size < 4000) {
      addMessage('system', 'System', '⚠️ That recording was too short to contain speech. Click the mic, wait a beat, say your command, then click the mic again to stop.');
      return;
    }
    const formData = new FormData();
    formData.append('file', blob, 'recording.webm');

    try {
      const res = await fetch('/transcribe', { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok) {
        addMessage('system', 'System', `⚠️ Transcription failed: ${data.detail || res.status}`);
        return;
      }
      if (data.text) {
        document.getElementById('inputBox').value = data.text;
        updateSendState();
        sendMessage();
      } else {
        addMessage('system', 'System', '⚠️ No speech detected — try speaking closer to the mic.');
      }
    } catch (err) {
      addMessage('system', 'System', `⚠️ Could not reach the backend: ${err.message}`);
    }
  }

  // ── Phone number save/load ─────────────────────────────────────────
  const phoneField = document.getElementById('phoneField');
  const phoneSave  = document.getElementById('phoneSave');

  // Load saved phone number on page load
  fetch('/settings/phone')
    .then(r => r.json())
    .then(data => {
      if (data.phone_number) phoneField.value = data.phone_number;
    })
    .catch(() => {});

  phoneSave.addEventListener('click', function() {
    const phone = phoneField.value.trim();
    fetch('/settings/phone', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone_number: phone }),
    })
    .then(r => r.json())
    .then(() => {
      phoneSave.textContent = '✅';
      setTimeout(() => { phoneSave.textContent = '📞'; }, 1500);
    })
    .catch(() => {
      phoneSave.textContent = '❌';
      setTimeout(() => { phoneSave.textContent = '📞'; }, 1500);
    });
  });
</script>
</body>
</html>
