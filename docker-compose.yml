services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      - voiceops_audio:/tmp/voiceops_audio
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload --log-level info

volumes:
  voiceops_audio:
